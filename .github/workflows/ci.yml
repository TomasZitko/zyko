name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: zyko, POSTGRES_PASSWORD: zyko, POSTGRES_DB: zyko_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://zyko:zyko@localhost:5432/zyko_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Performance budgets
        run: |
          psql postgres://zyko:zyko@localhost:5432/zyko_test -c "create database zyko_perf" -c "create database zyko_e2e"
          NODE_ENV=production pnpm --filter @zyko/web build
          DATABASE_URL=postgres://zyko:zyko@localhost:5432/zyko_perf pnpm perf
      - run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: pnpm test:e2e
        env: { E2E_DATABASE_URL: "postgres://zyko:zyko@localhost:5432/zyko_e2e" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: test-results }
